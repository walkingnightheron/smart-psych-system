spring:
  datasource:
    url: jdbc:h2:mem:psych_assessment;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql

app:
  cache:
    mode: redis-with-fallback
    ttl-seconds: 1800
  mq:
    transport: async
    listener-auto-startup: false
  seed:
    enabled: true
